[package]
description = "Shared PDF reading, rendering and optional writing for Craft apps"
edition.workspace = true
license.workspace = true
name = "craft-pdf"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

#[features]
#default = []
#read = ["dep:hayro-syntax", "dep:thiserror"]
#interpret = ["read", "dep:hayro-interpret"]
#raster = ["interpret", "dep:hayro", "dep:bytemuck"]
#write = ["dep:krilla", "dep:thiserror"]
#write-pdf = ["write", "krilla/pdf"]
#write-simple-text = ["write", "krilla/simple-text"]

[dependencies]
bytemuck = {workspace = true}
hayro = {workspace = true}
hayro-interpret = {workspace = true}
hayro-syntax = {workspace = true}
krilla = {workspace = true}
thiserror = {workspace = true}

[dev-dependencies]
hayro-cmap = "=0.1.0"
hayro-interpret = {version = "=0.7.0", default-features = false}
hayro-syntax = "=0.7.2"
kurbo = "0.13"
ttf-parser = "=0.25.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
