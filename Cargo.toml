[package]
edition = "2024"
name = "xpages"
version = "0.1.0"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/wordcraft"
rust-version = "1.95"
version = "0.9.0"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
# internal
craft-pdf = {path = "crates/craft-pdf"}
craft-ui = {path = "crates/craft-ui"}
wordcraft-control-key = {path = "crates/control-key"}
wordcraft-doc = {path = "crates/doc"}
wordcraft-docbin = {path = "crates/docbin"}
wordcraft-docx = {path = "crates/docx"}
wordcraft-engine = {path = "crates/engine"}
wordcraft-fonts = {path = "crates/fonts"}
wordcraft-formats = {path = "crates/formats"}
wordcraft-geom = {path = "crates/geom"}
wordcraft-layout = {path = "crates/layout"}
wordcraft-mcp = {path = "crates/mcp"}
wordcraft-metafile = {path = "crates/metafile"}
wordcraft-pdf = {path = "crates/pdf"}
wordcraft-proof = {path = "crates/proof"}
wordcraft-render = {path = "crates/render"}
wordcraft-ui-egui = {path = "crates/ui-egui"}
wordcraft-zotero = {path = "crates/zotero"}

# foundation
bytemuck = "1"
hayro = {version = "=0.7.1", default-features = false}
hayro-interpret = {version = "=0.7.0", default-features = false, features = ["embed-fonts", "embed-cmaps"]}
hayro-syntax = {version = "=0.7.2", default-features = false, features = ["std"]}
krilla = {version = "=0.8.2", default-features = false, features = ["raster-images"]}
kurbo = {version = "0.13", features = ["serde"]}
log = "0.4"
proptest = "1"
rayon = "1"
regex = {version = "1", default-features = false, features = ["std", "unicode", "perf"]}
regex-automata = {version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"]}
serde = {version = "1", features = ["derive", "rc"]}
serde_json = {version = "1", features = ["float_roundtrip"]}
thiserror = "2"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1"

# text / rendering / formats
harfrust = "0.13"
skrifa = "0.47"
# WOFF / WOFF2 web fonts added by the user (#582): pure Rust (MIT); its brotli and zlib decoders
# (brotli-decompressor, flate2) are already in the tree.
image = {version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"]}
quick-xml = "0.41"
vello_cpu = "0.2"
wuff = "0.2.9"
zip = {version = "3", default-features = false, features = ["deflate"]}
# zlib streams (compressed metafile pictures in `.doc` drawings); already in the lock as a dependency of other crates.
cfb = "0.15"
miniz_oxide = "0.8"
# Legacy text encodings (GBK/GB18030, Big5, Shift_JIS, EUC-KR, single-byte code pages) for plain
# text and CSV recipient lists (#778): encoding_rs ((Apache-2.0 OR MIT) AND BSD-3-Clause) and its
# detector chardetng (Apache-2.0 OR MIT), both pure Rust (Firefox's).
chardetng = "1"
encoding_rs = "0.8"
# Password-protected (agile-encrypted) Word documents: pure-Rust RustCrypto primitives.
aes = "0.9"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
zeroize = "1"

arboard = {version = "3.6", default-features = false, features = ["wayland-data-control"]}
eframe = {version = "0.37.0", default-features = false}
egui_kittest = {version = "0.37.0", features = ["wgpu"]}
rfd = "0.17"

adw = {version = "0.9.1", package = "libadwaita", features = ["v1_9"]}
egui = {version = "0.37.0", features = ["default_fonts"]}
egui_extras = {version = "0.37.0", default-features = false, features = ["svg"]}
egui_glow = "0.37.0"
gl_loader = "0.1.2"
gtk = {version = "0.11.2", package = "gtk4", features = ["v4_12"]}
relm4 = {version = "0.11.0", features = ["macros", "libadwaita"]}

[dependencies]
adw = {workspace = true}
egui = {workspace = true}
egui_glow = {workspace = true}
epoxy = {path = "crates/epoxy"}
gtk = {workspace = true}
libloading = "0.9.0"
relm4 = {workspace = true}
serde_json = {workspace = true}
wordcraft-control-key = {workspace = true}
wordcraft-doc = {workspace = true}
wordcraft-docbin = {workspace = true}
wordcraft-docx = {workspace = true}
wordcraft-engine = {workspace = true}
wordcraft-fonts = {workspace = true}
wordcraft-formats = {workspace = true}
wordcraft-geom = {workspace = true}
wordcraft-layout = {workspace = true}
wordcraft-mcp = {workspace = true}
wordcraft-metafile = {workspace = true}
#wordcraft-pdf = {workspace = true}
wordcraft-proof = {workspace = true}
wordcraft-render = {workspace = true}
wordcraft-ui-egui = {workspace = true}
wordcraft-zotero = {workspace = true}

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 16
debug = 0
lto = "thin"
opt-level = 3

#[patch.crates-io]
#krilla = {git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8"}

[patch.crates-io]
krilla = {path = "vendor/krilla"}

hayro = {path = "vendor/hayro"}
hayro-interpret = {path = "vendor/hayro-interpret"}
hayro-jbig2 = {path = "vendor/hayro-jbig2"}
hayro-syntax = {path = "vendor/hayro-syntax"}
