[package]
edition = "2024"
name = "xpages"
version = "0.1.0"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
egui = "0.37.0"
egui_glow = "0.37.0"
gl_loader = "0.1.2"
gtk = {version = "0.11.2", package = "gtk4", features = ["v4_12"]}
relm4 = {version = "0.11.0", features = ["macros", "libadwaita"]}

[dependencies]
egui = {workspace = true}
egui_glow = {workspace = true}
epoxy = {path = "crates/epoxy"}
gtk = {workspace = true}
libloading = "0.9.0"
relm4 = {workspace = true}
